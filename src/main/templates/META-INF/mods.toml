modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_issue_url}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
updateJSONURL = "${mod_update_url}"
displayURL = "${mod_url}"
logoFile = "text_logo_small.png"
logoBlur = false
credits = "${mod_credits}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
mandatory = true
versionRange = "${geckolib_version_range}"
ordering = "BEFORE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jei"
mandatory = false
versionRange = "${jei_version_range}"
ordering = "BEFORE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "nerb"
mandatory = false
versionRange = "[9999+INCOMPATIBLE_WITH_BIOMANCY,)"
ordering = "NONE"
side = "BOTH"
